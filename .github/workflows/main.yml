name: Run tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            gemfile: gemfiles/activerecord_7_0.gemfile
          - ruby: "3.1"
            gemfile: gemfiles/activerecord_7_1.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/activerecord_7_2.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/activerecord_8_0.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/activerecord_8_1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - name: Set up MySQL 8.0
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          user: test
          password: test

      - name: Create MySQL test database
        run: mysql -u test -p'test' -h 127.0.0.1 -e 'CREATE DATABASE test'

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
